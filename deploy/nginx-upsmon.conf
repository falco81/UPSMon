# /etc/nginx/conf.d/upsmon.conf
#
# upsmon's pages, over TLS:
#
#   https://ups.example.local/            the dashboard: the UPS, the plug, the sensors
#   https://ups.example.local/settings/   Settings, behind a sign-in
#
# Both are PHP that only relays to the upsmon daemon on 127.0.0.1 (9848 for
# the dashboard, 9849 for Settings), run in a php-fpm pool of upsmon's own.
# Everything else here is a file (the style, the scripts, the languages) or
# refused. install.sh writes the host name and who may reach the pages; the
# certificate and its TLS are written by upsmon_web.py when they are changed
# on Settings → Certificates and TLS.

# Signing in is limited per address: a wrong password costs time. The whole
# query string is looked at, not $arg_api: that one takes the first of two
# api= and never decodes %61pi, and the page refuses both spellings anyway.
map $args $upsmon_login_key {
    "~(^|&)api=login(&|$)"   $binary_remote_addr;
    default                  "";
}
limit_req_zone $upsmon_login_key zone=upsmon_login:1m rate=20r/m;
limit_req_zone $binary_remote_addr zone=upsmon_all:10m rate=20r/s;

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name ups.example.local;            # <- your hostname
    server_tokens off;
    # A certificate by ACME: the CA's HTTP-01 challenge answered on port 80
    # by acme.php - the answer is in upsmon's database. Everything else goes
    # to HTTPS.
    location ^~ /.well-known/acme-challenge/ {
        limit_req     zone=upsmon_all burst=20 nodelay;
        fastcgi_pass  unix:/run/php-fpm/upsmon.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/upsmon/acme.php;
        include       fastcgi_params;
        fastcgi_read_timeout 10s;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl http2 default_server;
    listen      [::]:443 ssl http2 default_server;
    server_name ups.example.local;            # <- your hostname

    root  /var/www/upsmon;
    index index.php;
    server_tokens off;

    access_log /var/log/nginx/upsmon-access.log;
    error_log  /var/log/nginx/upsmon-error.log;

    ssl_certificate           /etc/nginx/certs/upsmon.pem;
    ssl_certificate_key       /etc/nginx/certs/upsmon.key;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve            X25519:secp384r1:prime256v1;
    ssl_session_cache         shared:UPSMON:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    # No Content-Security-Policy here: the pages send their own (Settings with
    # a nonce made for each page), and a browser given two enforces both.

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    client_max_body_size 64k;
    client_body_timeout  60s;

    if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }
    # php2shell (CVE-2026-109618, CVE-2026-109619): nothing on upsmon's pages
    # sends a multipart body, and PHP takes one apart before any page runs.
    if ($http_content_type ~* "multipart") { return 403; }

    # ---- the dashboard: for everybody on these networks, no sign-in --------
    location = / {
        # ALLOW-BEGIN
        allow 192.168.0.0/16;         # <- who may reach the pages
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        # ALLOW-END
        allow 127.0.0.1;
        allow ::1;
        deny  all;
        limit_req zone=upsmon_all burst=60 nodelay;
        limit_req_status 429;
        fastcgi_pass   unix:/run/php-fpm/upsmon.sock;
        fastcgi_param  SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param  HTTPS on;
        include        fastcgi_params;
        # Writing a UPS variable waits for the driver to confirm it.
        fastcgi_read_timeout 120s;
    }
    location = /index.php { return 301 /; }

    # ---- Settings: behind a sign-in ------------------------------------------
    location = /settings { return 301 /settings/; }
    location = /settings/ {
        # ALLOW-BEGIN
        allow 192.168.0.0/16;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        # ALLOW-END
        allow 127.0.0.1;
        allow ::1;
        deny  all;
        limit_req zone=upsmon_login burst=10 nodelay;
        limit_req zone=upsmon_all   burst=60 nodelay;
        limit_req_status 429;
        fastcgi_pass   unix:/run/php-fpm/upsmon.sock;
        fastcgi_param  SCRIPT_FILENAME $document_root/settings/index.php;
        fastcgi_param  HTTPS on;
        include        fastcgi_params;
        # A new version sent from Settings → Upgrades: the package itself is
        # the body (never a multipart form). Only here; the page refuses
        # anything else this big.
        client_max_body_size 64m;
        fastcgi_request_buffering on;
        fastcgi_read_timeout 900s;
    }

    # ---- files ------------------------------------------------------------------
    location /assets/ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
    location ~ ^/(favicon\.svg|favicon\.ico|favicon-32\.png|apple-touch-icon\.png)$ {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # Nothing else: no other PHP file answers when asked by name (the ones
    # that are included among them), no language file, no dot file.
    location ~ \.php$ { return 404; }
    location /lang/   { return 404; }
    location ~ /\.    { deny all; }
    location /        { return 404; }
}
